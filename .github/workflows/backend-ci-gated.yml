# Gates PRs into dev / qa / main against a clean .NET build + tests.
name: Backend · gated PR

on:
  pull_request:
    branches: [dev, qa, main]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci-gated.yml'

defaults:
  run:
    working-directory: Backend

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PcPrizePick.slnx

      - name: Build (Release)
        run: dotnet build PcPrizePick.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PcPrizePick.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_number }}
          path: Backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
