# Mirrors work/Frontend's ci-build.yml: on push to dev / qa / main, build
# the configuration matching the branch name and upload the bundle as a
# downloadable artifact ready for whichever deploy target you wire up next.
name: Frontend · branch build

on:
  push:
    branches: [dev, qa, main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci-build.yml'

defaults:
  run:
    working-directory: Frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Map branch → Angular configuration:
      #   main → production
      #   qa   → qa
      #   dev  → development
      - name: Resolve build configuration
        id: cfg
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "config=production" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "config=qa" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "config=development" >> "$GITHUB_OUTPUT" ;;
            *)    echo "config=development" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build (${{ steps.cfg.outputs.config }})
        run: npx ng build --configuration=${{ steps.cfg.outputs.config }} --no-progress

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.ref_name }}-${{ github.run_number }}
          path: Frontend/dist/pc-prize-pick/
          retention-days: 14
          if-no-files-found: error
