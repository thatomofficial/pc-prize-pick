<nav class="nav u-container">
  <a class="nav__brand" routerLink="/" aria-label="PC Prize Pick — home">
    <span class="nav__brand-mark">PC/</span>
    <span class="nav__brand-name">Prize Pick</span>
    <span class="nav__brand-locale">ZA</span>
  </a>

  <ul class="nav__links" role="list">
    <li><a class="nav__link" routerLink="/competitions">Competitions</a></li>
    <li><a class="nav__link" routerLink="/tiers">Tiers</a></li>
    <li><a class="nav__link" routerLink="/how-it-works">How it works</a></li>
    <li><a class="nav__link" routerLink="/winners">Winners</a></li>
  </ul>

  <div class="nav__actions">
    @if (user(); as u) {
      <a
        class="nav__profile"
        routerLink="/account"
        [attr.aria-label]="'View account for ' + u.displayName"
      >
        <span class="nav__profile-initials t-mono" aria-hidden="true">{{ initials() }}</span>
        <span class="nav__profile-text">
          <span class="nav__profile-name">{{ u.displayName }}</span>
          <span class="nav__profile-hint t-overline">View account</span>
        </span>
      </a>
    } @else {
      <a class="nav__signin" routerLink="/login">Sign in</a>
    }
    <a class="nav__cta" routerLink="/competitions">
      <span class="nav__cta-text">Pick a build</span>
      <span class="nav__cta-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</nav>
